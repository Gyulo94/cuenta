name: cuenta

services:
  server:
    image: ${SERVER_IMAGE}
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_NAME: ${APP_NAME}
      APP_LOGO: ${APP_LOGO}
      APP_ENV: ${APP_ENV}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      CLIENT_URL: ${CLIENT_URL}
      EMAIL_URL: ${EMAIL_URL}
      SENDER_EMAIL: ${SENDER_EMAIL}
      SENDER_PWD: ${SENDER_PWD}
    ports:
      - "${SERVER_PORT}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - cuenta-network

  client:
    image: ${CLIENT_IMAGE}
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "${CLIENT_PORT}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      cuenta-network:
      nginx-network:
        aliases:
          - cuenta-client

networks:
  cuenta-network:
    driver: bridge
  nginx-network:
    external: true
    name: nginx_gyubuntu_net
