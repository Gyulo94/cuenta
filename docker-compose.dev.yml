name: cuenta-dev

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${SERVER_PORT}:8000"
    volumes:
      - ./server:/app
      - server-build:/app/build
      - server-project-gradle:/app/.gradle
      - server-gradle-cache:/root/.gradle
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks:
      - cuenta-dev-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    init: true
    environment:
      VITE_API_PROXY_TARGET: http://server:8000
      VITE_USE_POLLING: "true"
    ports:
      - "${CLIENT_PORT}:3000"
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
      - client-pnpm-store:/pnpm/store
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - cuenta-dev-network

volumes:
  server-build:
  server-project-gradle:
  server-gradle-cache:
  client-node-modules:
  client-pnpm-store:

networks:
  cuenta-dev-network:
    driver: bridge
